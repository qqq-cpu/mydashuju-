name: OSS to ClickHouse Pipeline

on:
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      import_limit:
        description: Number of daily CSV files to sync from OSS
        default: "3"
        required: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Unit tests
        run: pytest tests/ -v

  deploy:
    needs: test
    # Self-hosted runner uses your PC public IP (already in CK whitelist).
  # Install runner: see GITHUB_SETUP.md section "Self-hosted Runner".
    runs-on: self-hosted
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Write config.yaml from secrets
        run: |
          cat > config.yaml <<EOF
          oss:
            endpoint: "${{ secrets.OSS_ENDPOINT }}"
            bucket: "${{ secrets.OSS_BUCKET }}"
            access_key_id: "${{ secrets.OSS_ACCESS_KEY_ID }}"
            access_key_secret: "${{ secrets.OSS_ACCESS_KEY_SECRET }}"
          clickhouse:
            host: "${{ secrets.CK_HOST }}"
            port: ${{ secrets.CK_PORT }}
            user: "${{ secrets.CK_USER }}"
            password: "${{ secrets.CK_PASSWORD }}"
            database: "db_price_index"
          project:
            base_date: "2025-05-17"
          EOF
      - name: Runner outbound IP (for CK whitelist debugging)
        shell: bash
        run: |
          echo "Runner IP: $(curl -s https://api.ipify.org || echo unknown)"
      - name: Test OSS connection
        run: python src/test_connection.py oss
      - name: Download CSV from OSS
        run: python src/oss_downloader.py --limit ${{ github.event.inputs.import_limit || '3' }}
      - name: Test ClickHouse connection
        run: python src/test_connection.py ck
      - name: Ensure ClickHouse tables exist
        run: python src/ck_loader.py ddl
      - name: Import OSS data into ClickHouse
        run: python src/ck_loader.py import --limit ${{ github.event.inputs.import_limit || '3' }}
      - name: Calculate daily price index
        run: python src/ck_loader.py sql sql/calc_daily_index.sql
      - name: Generate trend chart
        run: python src/plot_index.py
      - name: Upload chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: price-index-chart
          path: report/price_index_trend.png
